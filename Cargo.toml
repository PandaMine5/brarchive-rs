[workspace]
members = ["crates/lib", "crates/cli", "crates/wasm"]
resolver = "2"

# Shared by every crate via `<field>.workspace = true`. Bump the version here
# and all three crates (and the CLI's dependency on the lib) move together.
[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.81"
authors = ["theaddonn <theaddonn@gmail.com>"]
repository = "https://github.com/bedrock-crustaceans/brarchive"
license = "Apache-2.0"

[workspace.dependencies]
brarchive = { path = "crates/lib", version = "0.4.0" }

[profile.release]
opt-level = 3
lto = true
strip = true    
codegen-units = 1


# cargo build -p brarchive-cli --profile dev; ./brarchive-cli encode "temp" --recursive --skip-root  
