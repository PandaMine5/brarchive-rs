name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release'
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: brarchive-cli
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: brarchive-cli.exe
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: brarchive-cli
          - target: aarch64-apple-darwin
            os: macos-15
            binary: brarchive-cli

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify native Apple Silicon runner
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          echo "Runner architecture: $(uname -m)"
          rustc -vV
          test "$(uname -m)" = "arm64"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p brarchive-cli

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${TAG#v}"
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          tar czf brarchive-cli-v${VERSION}-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
          echo "ASSET=brarchive-cli-v${VERSION}-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = $env:TAG -replace '^v', ''
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" .
          Compress-Archive -Path "${{ matrix.binary }}" -DestinationPath "brarchive-cli-v${VERSION}-${{ matrix.target }}.zip"
          echo "ASSET=brarchive-cli-v${VERSION}-${{ matrix.target }}.zip" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  build-wasm:
    name: Package WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Package WASM
        run: |
          VERSION="${TAG#v}"
          (cd crates/wasm && zip -r ../../brarchive-v${VERSION}-wasm.zip deno.json README.md mod.ts lib)
          echo "ASSET=brarchive-v${VERSION}-wasm.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-cli, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
