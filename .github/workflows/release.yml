name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.0)'
        required: true
        default: 'v0.4.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Tag push -> inputs.tag is empty -> falls back to the pushed tag name
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: brarchive
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: brarchive.exe
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: brarchive

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --package brarchive-cli --bin brarchive

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION=${TAG#v}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          tar czf brarchive-v${VERSION}-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
          echo "ASSET=brarchive-v${VERSION}-${{ matrix.target }}.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = $env:TAG -replace '^v', ''
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" .
          Compress-Archive -Path "${{ matrix.binary }}" -DestinationPath "brarchive-v${VERSION}-${{ matrix.target }}.zip"
          echo "ASSET=brarchive-v${VERSION}-${{ matrix.target }}.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  build-wasm:
    name: Package WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package WASM
        run: |
          VERSION=${TAG#v}
          (cd crates/wasm && zip -r ../../brarchive-v${VERSION}-wasm.zip deno.json README.md mod.ts lib)
          echo "ASSET=brarchive-v${VERSION}-wasm.zip" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-cli, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts/
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
